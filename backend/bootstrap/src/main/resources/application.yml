spring:
  application:
    name: halal-food-finder
  threads:
    # Blocking thread-per-request model, but on JDK 21 Virtual Threads (NOT WebFlux).
    virtual:
      enabled: true
  # Local dev datasource (docker-compose.yml: postgis service). Flyway auto-migrates
  # the users table on boot. Override via env (SPRING_DATASOURCE_URL) in real envs.
  datasource:
    url: jdbc:postgresql://localhost:5432/halal
    username: halal
    password: halal
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

server:
  port: 8080

# Code-first OpenAPI (springdoc). Spec is emitted at /v1/api-docs and committed
# to the repository so the frontend type client and browser extensions consume it.
springdoc:
  api-docs:
    path: /v1/api-docs
    enabled: true
    # Emit the OpenAPI 3.1 dialect (the committed /v1 spec is 3.1).
    version: openapi_3_1
  swagger-ui:
    path: /v1/swagger-ui.html
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        # Only health is exposed. Info, env, beans, mappings, configprops,
        # metrics, loggers, ... are all OFF (ActuatorLockdownTest enforces it).
        include: health
  endpoint:
    health:
      # sc-134 (finding #8): never expose detailed health internals outside dev.
      show-details: never

# sc-136 auth rate limiting (in-process Bucket4j token buckets, single node).
app:
  ratelimit:
    # Token-bucket capacity: max burst before the budget empties.
    capacity: 20
    # Refill: 20 tokens per minute per client IP context.
    refill-per-window: 20
    refill-window: 1m

# Security parameter — zombie access-token TTL (Omar's sc-136 case 6).
# The short-lived access JWT default is 900s (app.jwt.access-ttl-seconds, wired
# in TokenIssuerConfig). This TTL is the accepted "zombie JWT" window: once an
# account's refresh token is revoked, an already-issued access JWT can remain
# valid for up to this long. Deliberately NO in-memory denylist is kept (per the
# adjudicated case 6 acceptance) — revocation takes effect for the REFRESH/session
# grant, and the short TTL bounds the residual risk. Do not silently raise it.

---
# Local-development override: expose full health details for engineering.
spring:
  config:
    activate:
      on-profile: dev
management:
  endpoint:
    health:
      show-details: always