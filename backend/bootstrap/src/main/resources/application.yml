spring:
  application:
    name: halal-food-finder
  threads:
    # Blocking thread-per-request model, but on JDK 21 Virtual Threads (NOT WebFlux).
    virtual:
      enabled: true
  # Local dev datasource (docker-compose.yml: postgis service). Flyway auto-migrates
  # the users table on boot. Override via env (SPRING_DATASOURCE_URL) in real envs.
  datasource:
    url: jdbc:postgresql://localhost:5432/halal
    username: halal
    password: halal
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

server:
  port: 8080

# Code-first OpenAPI (springdoc). Spec is emitted at /v1/api-docs and committed
# to the repository so the frontend type client and browser extensions consume it.
springdoc:
  api-docs:
    path: /v1/api-docs
    enabled: true
    # Emit the OpenAPI 3.1 dialect (the committed /v1 spec is 3.1).
    version: openapi_3_1
  swagger-ui:
    path: /v1/swagger-ui.html
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always