# Local development services for the Halal Food Finder backend.
#
#   docker compose up -d
#
# Brings up:
#   - Postgres 17 + PostGIS 3.4  (the persistence adapter's database)
#   - MinIO S3-compatible storage (private buckets; presigned access from the app)
#
# The Spring Boot app itself runs on the host via `./gradlew :bootstrap:bootRun`
# and connects to these services on localhost.
name: halal-food-finder

services:
  postgis:
    image: postgis/postgis:17-3.4
    container_name: hff-postgis
    environment:
      POSTGRES_DB: halal
      POSTGRES_USER: halal
      POSTGRES_PASSWORD: halal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halal -d halal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: hff-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Prove MinIO is reachable and scaffold the private bucket the app writes to.
  # Retries internally so it is not coupled to the server healthcheck; the
  # dependency just needs the minio container to be started.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin; until mc ready local; do echo 'waiting for minio'; sleep 2; done; mc mb --ignore-existing local/halal; echo 'MinIO bucket halal ready'"]

volumes:
  pgdata:
  miniodata: