[versions]
kotlin = "2.0.21"
spring-boot = "3.3.13"
spring-dependency-management = "1.1.6"
springdoc = "2.6.0"
kotest = "5.9.1"
kotest-spring = "1.3.0"
mockk = "1.13.13"
testcontainers = "1.20.4"
postgresql = "42.7.4"
bouncycastle = "1.77"
# Bump past the Boot-3.3 BOM pin (10.10.0) which warns on PostgreSQL 17.
flyway = "10.15.0"
# JWT (RS256) signing/parsing for the short-lived access token.
nimbus-jose-jwt = "9.48"

[libraries]
# --- Spring Boot (versions managed by the spring-boot-dependencies BOM) ---
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
# Kotlin data-class JSON support (Spring Boot does not pull this in automatically).
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
springdoc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
# Spring Security Crypto: Argon2PasswordEncoder (Argon2id) for password hashing.
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
# Argon2PasswordEncoder's Argon2 implementation delegates to BouncyCastle.
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
# Nimbus JOSE + JWT: RS256 signing for the short-lived access token (sc-40).
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
# Apache HC5 (version from the Boot BOM): request factory that returns 401 as a
# normal response (the JDK HttpURLConnection client cannot read 401 in streaming).
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5" }

# --- Persistence / data ---
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# --- Testing ---
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-spring = { module = "io.kotest.extensions:kotest-extensions-spring", version.ref = "kotest-spring" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
# Test-only SLF4J binding so Testcontainers/docker-java diagnostics are visible.
slf4j-simple = { module = "org.slf4j:slf4j-simple" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }